[project]
authors = [{name = "Ethan Holz", email = "ethan.holz@omsf.io"}]
description = "AWS primitives and operations for benchmarking infrastructure."
name = "benchmarking-aws"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "benchmarking-orchestration-core>=0.1.0,<0.2",
    "boto3>=1.42.81,<2",
    "requests>=2,<3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
